[package]
name = "app"
version = "0.1.0"
description = "PRTS Story Reader - Arknights story reader"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` enables WebView DevTools (F12 / right-click → Inspect) in RELEASE builds too,
# not just debug — needed because the production Windows build otherwise ships without them.
tauri = { version = "2.10.3", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
html-escape = "0.2"
