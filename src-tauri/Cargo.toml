[package]
name = "app"
version = "1.1.0"
description = "Arkstage (方舟剧场) - offline replay player for Arknights story performances"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Size-optimized release profile (Tauri's recommended settings).
# Without this, the Android cdylib ships unoptimized + with full debug symbols,
# which is the dominant per-arch cause of the bloated APK (a single arch .so was
# ~160 MB). strip + LTO + size-opt bring each arch .so down to the ~15-25 MB range.
# Applies to the desktop release build too (smaller Windows binary as a bonus).
[profile.release]
panic = "abort"     # drop unwinding tables (smaller; Tauri apps don't unwind across FFI)
codegen-units = 1   # maximize cross-unit optimization (slower compile, smaller output)
lto = "thin"        # thin LTO — nearly all the size win of fat LTO, much faster compile
opt-level = "s"     # optimize for binary size
strip = true        # strip symbols from the final binary

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` enables WebView DevTools (F12 / right-click → Inspect) in RELEASE builds too,
# not just debug — needed because the production Windows build otherwise ships without them.
tauri = { version = "2.10.3", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
html-escape = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
