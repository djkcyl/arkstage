[package]
name = "app"
version = "0.1.0"
description = "PRTS Story Reader - Arknights story reader"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
html-escape = "0.2"
