# Arkstage mirror — backfill (manual, bounded batches).
#
# Deploy to `.github/workflows/sync-backfill.yml` in djkcyl/arkstage-assets.
# Walks ALL story pages in the index in order, a bounded `limit` per run, and
# persists a cursor (.cursor.json at the repo root) so repeated manual dispatches
# resume where the last left off — this is how the mirror gets filled the first
# time without one giant job. Re-syncing a story is idempotent (already-mirrored
# assets are skipped). Incremental keeps it fresh afterwards.
name: sync-backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of stories to sync this run"
        required: true
        default: "50"

concurrency:
  group: arkstage-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror (this repo)
        uses: actions/checkout@v4

      - name: Checkout sync tool (prts-reader/tools/sync)
        uses: actions/checkout@v4
        with:
          repository: djkcyl/prts-reader
          path: _tool
          sparse-checkout: tools/sync
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          echo "CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: _tool/tools/sync/node_modules
          key: sync-node-${{ hashFiles('_tool/tools/sync/package-lock.json') }}

      - name: Install deps
        working-directory: _tool/tools/sync
        run: npm install --no-audit --no-fund

      - name: Run backfill batch
        working-directory: _tool/tools/sync
        env:
          SYNC_OUT: ${{ github.workspace }}
        run: node sync.js --backfill --limit "${{ github.event.inputs.limit }}"

      - name: Commit, pin version ref, push
        run: |
          git config user.name "arkstage-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "sync: backfill batch $(date -u +%F) [skip ci]"
          SHA=$(git rev-parse HEAD)
          node -e "const f='version.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.ref='$SHA';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          git add version.json
          git commit -m "sync: pin ref $SHA [skip ci]"
          git push
