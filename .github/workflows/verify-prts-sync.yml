name: Verify PRTS runtime sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit story references and upstream media
        run: npm run verify:prts-sync
