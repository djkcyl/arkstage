name: CI

# Runs on every push and pull request: static checks always, and on pushes it
# also builds installable "CI" artifacts for each platform (attached to the run).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # manual run — pick any branch in the Actions UI to build it

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- static checks: type-check, frontend build, Rust tests + build ----------
  check:
    name: Static checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Cross-platform native deps (npm/cli#4828): the committed package-lock.json,
      # generated on linux-x64, only carries full entries for the linux-x64 native
      # binaries of @tauri-apps/cli, lightningcss, etc. BOTH `npm ci` and a plain
      # `npm install` then reproduce that gap, leaving the platform binary missing on
      # macOS/Windows → "Cannot find native binding" at `tauri build`. The reliable
      # fix (npm's own recommendation) is to drop the incomplete lockfile and resolve
      # fresh, which installs the correct per-platform optional dependencies.
      # `shell: bash` so `rm -f` also works on Windows (its default shell is
      # PowerShell, whose `rm` is Remove-Item and rejects `-f`). Git-bash ships on
      # the windows runner.
      - name: Install dependencies (fresh resolve for cross-platform native deps)
        shell: bash
        run: rm -f package-lock.json && npm install --no-audit --no-fund
      - name: Run static test suite (tsc + vite build + cargo test/build)
        run: bash scripts/test-static.sh

  # ---- CI build: produce installers per platform on every push ----------------
  build:
    name: Build (${{ matrix.platform }})
    needs: check
    # Auto-build only on master pushes; manual workflow_dispatch can build any branch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Cross-platform native deps (npm/cli#4828): the committed package-lock.json,
      # generated on linux-x64, only carries full entries for the linux-x64 native
      # binaries of @tauri-apps/cli, lightningcss, etc. BOTH `npm ci` and a plain
      # `npm install` then reproduce that gap, leaving the platform binary missing on
      # macOS/Windows → "Cannot find native binding" at `tauri build`. The reliable
      # fix (npm's own recommendation) is to drop the incomplete lockfile and resolve
      # fresh, which installs the correct per-platform optional dependencies.
      # `shell: bash` so `rm -f` also works on Windows (its default shell is
      # PowerShell, whose `rm` is Remove-Item and rejects `-f`). Git-bash ships on
      # the windows runner.
      - name: Install dependencies (fresh resolve for cross-platform native deps)
        shell: bash
        run: rm -f package-lock.json && npm install --no-audit --no-fund
      - name: Build the app (native target)
        # CI/script builds ship with the on-screen debug console enabled by default
        # (users can turn it off in Settings). Ordinary local builds default off.
        env:
          VITE_DEBUG_DEFAULT: "true"
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: prts-reader-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
