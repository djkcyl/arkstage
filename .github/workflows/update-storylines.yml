# Regenerate the StoryLine taxonomy and publish the standalone runtime bookshelf
# payload to the `resources` branch. The app refreshes metadata.json through
# jsDelivr on every launch, so taxonomy/cover updates do not require a new release.
name: update-bookshelf-resources

on:
  schedule:
    - cron: "0 14 * * *" # UTC 14:00 = Asia/Shanghai 22:00
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the payload even if input fingerprints are unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-storylines
  cancel-in-progress: false

jobs:
  update-storylines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            LICENSE
            LICENSE-SCOPE.md
          sparse-checkout-cone-mode: false

      # The hosted runner already has Node >=20. Do not install npm packages,
      # image tools or fetch the image branch until the cheap probe finds work.
      - name: Check upstream revisions and image hashes
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/build-resources/sync-resources.mjs

      - name: Install parser dependencies
        if: steps.probe.outputs.changed == 'true' || inputs.force == true
        working-directory: tools/gen-index
        run: npm ci --no-audit --no-fund

      - name: Ensure image tools
        if: steps.probe.outputs.changed == 'true' || inputs.force == true
        run: |
          if ! command -v convert >/dev/null || ! command -v identify >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick
          fi

      - name: Load the current resource branch
        if: steps.probe.outputs.changed == 'true' || inputs.force == true
        run: |
          git fetch origin resources --depth=1
          git worktree add --detach "$RUNNER_TEMP/arkstage-resources-base" FETCH_HEAD

      - name: Incrementally update taxonomy, covers and banners
        if: steps.probe.outputs.changed == 'true' || inputs.force == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/build-resources/sync-resources.mjs --update --base="$RUNNER_TEMP/arkstage-resources-base" --out="$RUNNER_TEMP/arkstage-resources-new"

      - name: Publish resources branch
        if: steps.probe.outputs.changed == 'true' || inputs.force == true
        run: |
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/arkstage-resources-new/" "$RUNNER_TEMP/arkstage-resources-base/"
          cd "$RUNNER_TEMP/arkstage-resources-base"
          git config user.name "arkstage-index[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Runtime resources already up to date — nothing to publish."
          else
            git commit -m "data: incrementally sync bookshelf resources [skip ci]"
            git push origin HEAD:resources
          fi

      - name: Report no changes
        if: steps.probe.outputs.changed != 'true' && inputs.force != true
        run: echo "No upstream changes; skipped npm install, image downloads, conversions and publishing."
